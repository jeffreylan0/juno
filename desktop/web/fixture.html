<!doctype html>
<!--
  End-to-end tests only (built when SAI_E2E=1): known pixels to select over.
  White, with a red square at 100–300 px and a blue one at 400–600 px, and
  two paragraphs of text below them for Text and Element (each word in a
  span, so the tests know where it is).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fixture</title>
    <link rel="stylesheet" href="/src/fixture.css" />
  </head>
  <body>
    <div class="red"></div>
    <div class="blue"></div>
    <p class="q" id="q1"><span>Find</span> <span>the</span> <span>area</span> <span>of</span> <span>the</span> <span>red</span> <span>square.</span></p>
    <p class="q" id="q2"><span>Show</span> <span>your</span> <span>work.</span></p>
  </body>
</html>
