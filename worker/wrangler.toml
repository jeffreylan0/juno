# Hosted answers (see src/index.ts). Secrets are set with `wrangler secret put`,
# never committed: SUPABASE_URL, SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY,
# OPENAI_API_KEY, and STRIPE_WEBHOOK_SECRET once billing exists.
name = "selection-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# Cloudflare account id, to send answers through an AI Gateway named
# "selection-ai" (rate limits, spend analytics; logging is switched off per
# request). Empty: the Worker calls the vendors directly.
AI_GATEWAY_ID = ""

[env.production]
vars = { ENVIRONMENT = "production" }
