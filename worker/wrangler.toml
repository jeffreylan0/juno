# Hosted answers and billing (see src/index.ts). Secrets are set with
# `wrangler secret put`, never committed: SUPABASE_URL, SUPABASE_SECRET_KEY,
# ANTHROPIC_API_KEY, OPENAI_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
name = "juno"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cloudflare account id, to send answers through an AI Gateway named
# "juno" (rate limits, spend analytics; logging is switched off per
# request). Empty: the Worker calls the vendors directly.
AI_GATEWAY_ID = ""
# The prices on offer: Stripe lookup keys, in the order the apps show them
# (supabase/README.md). Empty: no plans are offered.
STRIPE_PRICES = "plus_semester,plus_year"
# "on" once Stripe Tax is set up in the Stripe dashboard.
STRIPE_TAX = ""

# Hosted answers a minute per account (Workers Rate Limiting): a script
# can't spend a month's answers in an afternoon. The id is any number unique
# within the Cloudflare account; the period is 10 or 60 seconds.
[[ratelimits]]
name = "ASK_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
