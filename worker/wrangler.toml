# Hosted answers and billing (see src/index.ts). Secrets are set with
# `wrangler secret put`, never committed: SUPABASE_URL, SUPABASE_SECRET_KEY,
# ANTHROPIC_API_KEY, OPENAI_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# GOOGLE_CLIENT_SECRET, UNLOCK_SIGNING_KEY.
name = "juno"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cloudflare account id, to send answers through an AI Gateway named
# "juno" (rate limits, spend analytics; logging is switched off per
# request). Empty: the Worker calls the vendors directly.
AI_GATEWAY_ID = ""
# The prices on offer: Stripe lookup keys, in the order the apps show them
# (supabase/README.md). A recurring price renews at its own interval; the
# days after a key are a one-time price's length, ignored for a recurring
# one. Empty: no plans are offered.
STRIPE_PRICES = "plus_semester:120,plus_year:365"
# "on" once Stripe Tax is set up in the Stripe dashboard.
STRIPE_TAX = ""
# The one-time unlock for students without an account (src/unlock.ts): the
# lookup key of a one-time Stripe price. Its licenses are signed with the
# UNLOCK_SIGNING_KEY secret (scripts/unlock-key.mjs). Either missing: not on offer.
UNLOCK_PRICE = "unlock"
# Google sign-in's desktop client id (public; supabase/README.md, step 3).
# Its secret: npx wrangler secret put GOOGLE_CLIENT_SECRET.
GOOGLE_CLIENT_ID = ""

# Hosted answers a minute per account (Workers Rate Limiting): a script
# can't spend a month's answers in an afternoon. The id is any number unique
# within the Cloudflare account; the period is 10 or 60 seconds.
[[ratelimits]]
name = "ASK_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The routes anyone may call without signing in (prices, Google sign-in, the
# unlock), a minute per address: they reach Stripe and Google, whose limits a
# flood would use up for everyone. The app asks after a paid unlock every
# 3 s (desktop/src/lib/account/unlock.ts), well within it.
[[ratelimits]]
name = "OPEN_LIMIT"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
