name: Desktop

# The desktop app (desktop/). Linux runs everything, end to end included, on
# a virtual display; macOS and Windows build against the real system SDKs and
# run the native unit tests. Only when something the app is built from changes.
on:
  push:
    branches: ['**']
    paths: ['desktop/**', 'extension/**', 'shared/**', 'tests/unit/desktop-*', 'pnpm-lock.yaml', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'extension/**', 'shared/**', 'tests/unit/desktop-*', 'pnpm-lock.yaml', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  linux:
    name: Linux (typecheck, native tests, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - name: System libraries (WebKitGTK, X11 tools for the end-to-end tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool imagemagick
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test:native
      - run: pnpm --filter desktop test:e2e

  native:
    name: ${{ matrix.os }} (build, native tests)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop test:native
      - run: pnpm --filter desktop exec tauri build --debug --no-bundle
      # Opened as a student opens it: its log, its windows and the screen say
      # whether anything showed (desktop/scripts/smoke-windows.ps1).
      - name: Open the app and see what shows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/debug -Filter *.exe | Select-Object -First 1
          ./desktop/scripts/smoke-windows.ps1 -Exe $exe.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && runner.os == 'Windows'
        with:
          name: windows-smoke
          path: ${{ runner.temp }}/juno-smoke.jpg
          if-no-files-found: ignore
