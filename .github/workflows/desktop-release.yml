name: Test build

# Installers for testers, built on real Macs and Windows machines: a universal
# macOS .dmg (Apple Silicon and Intel) and a Windows setup .exe. A `desktop-v*` tag, or Actions → Test build → Run
# workflow, publishes them as a GitHub prerelease with TESTERS.md as its
# notes; a push that changes this file only builds them, to check it works.
#
# Accounts and hosted answers come from the repository's Actions variables
# WXT_SUPABASE_URL, WXT_SUPABASE_KEY (the publishable key, public by design)
# and WXT_GATEWAY_URL (supabase/README.md, step 7), WXT_GOOGLE_CLIENT_ID
# (step 3) and WXT_UNLOCK_KEY (step 6), also public; without the first two
# the build has no accounts, and says so in the run's summary. No secret of
# any kind goes into a build. No caches either: a build others install never restores
# anything an ordinary run saved. The
# release carries SHA256SUMS and a signed build provenance attestation
# (`gh attestation verify <file> --repo jeffreylan0/selectionai`).
#
# Updates (desktop/README.md, Updates): the update key's public half (the
# TAURI_UPDATER_PUBKEY variable, or tauri.conf.json) goes into every build,
# which turns updating on. The private half never reaches a build, where
# every package's build code runs: the builds leave the update files unsigned
# (the Mac app as a .tar.gz, the Windows installer as it is), and `sign`
# signs them with the Tauri CLI alone. For a `desktop-vX.Y.Z` tag (that X.Y.Z
# becomes the app's version) it uses TAURI_SIGNING_PRIVATE_KEY from the
# `release` environment, which only those tags may use and which can wait
# for an owner's approval; the release then gets the update files and
# latest.json goes to the `updates` release, where installed apps look for a
# new version. Any other run signs with a throwaway key, to show the signing
# works. Every signature is checked against the public half first.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: ['**']
    paths: ['.github/workflows/desktop-release.yml']

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: mac.dmg
            # The app, which the updater installs from a .tar.gz of it.
            app: desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            # Signed ad hoc: without a Developer ID macOS still warns once,
            # but an unsigned bundle would be called "damaged" instead.
            signing: '-'
          - name: Windows (setup .exe)
            os: windows-latest
            targets: ''
            args: --bundles nsis
            bundle: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            # Also the update file: the updater runs the installer itself.
            asset: windows-setup.exe
            app: ''
            signing: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - run: pnpm install --frozen-lockfile
      - name: Version
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # A desktop-vX.Y.Z tag is the version; anything else keeps tauri.conf.json's.
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          VERSION=$version PUBKEY=$PUBKEY node -e '
            const c = { version: process.env.VERSION };
            if (process.env.PUBKEY) c.plugins = { updater: { pubkey: process.env.PUBKEY } };
            require("fs").writeFileSync("desktop/src-tauri/release.conf.json", JSON.stringify(c));'
          cat desktop/src-tauri/release.conf.json
      - name: Accounts
        shell: bash
        env:
          WXT_SUPABASE_URL: ${{ vars.WXT_SUPABASE_URL }}
          WXT_SUPABASE_KEY: ${{ vars.WXT_SUPABASE_KEY }}
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
          WXT_UNLOCK_KEY: ${{ vars.WXT_UNLOCK_KEY }}
        run: |
          if [ -n "$WXT_SUPABASE_URL" ] && [ -n "$WXT_SUPABASE_KEY" ]; then
            echo "::notice::Accounts are in this build ($WXT_SUPABASE_URL)."
            [ -n "$WXT_GOOGLE_CLIENT_ID" ] || echo "::warning::No Google sign-in in this build, email codes only: set the Actions variable WXT_GOOGLE_CLIENT_ID (supabase/README.md, step 3)."
            [ -n "$WXT_UNLOCK_KEY" ] || echo "::warning::No unlock in this build: set the Actions variable WXT_UNLOCK_KEY (supabase/README.md, step 6)."
          else
            echo "::warning::No accounts in this build: set the Actions variables WXT_SUPABASE_URL, WXT_SUPABASE_KEY and WXT_GATEWAY_URL (supabase/README.md, step 7)."
          fi
      - name: Build
        env:
          WXT_SUPABASE_URL: ${{ vars.WXT_SUPABASE_URL }}
          WXT_SUPABASE_KEY: ${{ vars.WXT_SUPABASE_KEY }}
          WXT_GATEWAY_URL: ${{ vars.WXT_GATEWAY_URL }}
          WXT_GOOGLE_CLIENT_ID: ${{ vars.WXT_GOOGLE_CLIENT_ID }}
          WXT_UNLOCK_KEY: ${{ vars.WXT_UNLOCK_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing }}
        run: pnpm --filter desktop exec tauri build ${{ matrix.args }} --config src-tauri/release.conf.json
      - name: Name the installer, and the Mac's update file
        shell: bash
        run: |
          mkdir -p out update
          cp ${{ matrix.bundle }} "out/Juno-$VERSION-${{ matrix.asset }}"
          # The .app in a .tar.gz, as Tauri's own update bundle has it: the
          # app at the top, links kept as links.
          if [ -n "${{ matrix.app }}" ]; then
            for app in ${{ matrix.app }}; do
              python3 -c 'import os, sys, tarfile; t = tarfile.open(sys.argv[2], "w:gz"); t.add(sys.argv[1], arcname=os.path.basename(sys.argv[1])); t.close()' \
                "$app" "update/Juno-$VERSION-mac.app.tar.gz"
            done
          fi
          ls -l out update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error
      - if: matrix.app != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-mac.app.tar.gz
          path: update/*
          if-no-files-found: error

  sign:
    name: Sign the update files
    needs: [app]
    runs-on: ubuntu-latest
    # The real key only for a version tag, from the `release` environment
    # (desktop/README.md, Updates); no environment, and a throwaway key, otherwise.
    environment: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'release' || '' }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            pnpm-lock.yaml
            desktop/scripts/latest-json.mjs
            desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Each build's files apart, so neither can slip in a file of the other's to be signed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-mac.app.tar.gz
          path: mac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-windows-setup.exe
          path: windows
      - name: The Tauri CLI, alone, at the lockfile's version
        run: |
          v=$(node -e 'const m = /\x27@tauri-apps\/cli\x27:\s*\n\s*specifier:[^\n]*\n\s*version:\s*([0-9.]+)/.exec(require("fs").readFileSync("pnpm-lock.yaml", "utf8")); if (!m) process.exit(1); console.log(m[1])')
          npm install --prefix "$RUNNER_TEMP/cli" --no-save --ignore-scripts --no-audit --no-fund "@tauri-apps/cli@$v"
          echo "TAURI=$RUNNER_TEMP/cli/node_modules/.bin/tauri" >> "$GITHUB_ENV"
      - name: Sign, and check every signature against the public half
        id: sign
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
          KEY: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ "$RELEASE" = true ]; then
            pubkey=${PUBKEY:-$(node -p "require('./desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey")}
            if [ -z "$KEY" ] || [ -z "$pubkey" ]; then
              echo "::warning::No update for this version: the update key's private half (the release environment's TAURI_SIGNING_PRIVATE_KEY secret) or its public half (the TAURI_UPDATER_PUBKEY variable) is missing (desktop/README.md, Updates)."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export TAURI_SIGNING_PRIVATE_KEY="$KEY" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$KEY_PASSWORD"
          else
            "$TAURI" signer generate --ci -p "" -w "$RUNNER_TEMP/throwaway.key" > /dev/null
            pubkey=$(cat "$RUNNER_TEMP/throwaway.key.pub")
            export TAURI_SIGNING_PRIVATE_KEY_PATH="$RUNNER_TEMP/throwaway.key" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          fi
          # Exactly the one file each build should have made, and nothing else.
          [ "$(ls mac)" = "$(cd mac && ls Juno-*-mac.app.tar.gz)" ] && [ "$(ls windows)" = "$(cd windows && ls Juno-*-windows-setup.exe)" ] || {
            echo "::error::Unexpected update files: $(ls mac windows | tr '\n' ' ')"; exit 1; }
          mkdir out && mv mac/* windows/* out/
          for f in out/*; do "$TAURI" signer sign "$f" > /dev/null; done
          node desktop/scripts/latest-json.mjs out "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$pubkey"
          mkdir signed && cp out/*.sig out/latest.json signed/
          echo "signed=$RELEASE" >> "$GITHUB_OUTPUT"
      - if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signed/*
          if-no-files-found: error

  publish:
    name: Publish the prerelease
    needs: [app, sign]
    # A desktop-v* tag, or Run workflow on main: never a release from another branch.
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            TESTERS.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: out
          merge-multiple: true
      # A signed version: its update files, their signatures and latest.json too.
      - if: needs.sign.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{update-*,signatures}'
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/Juno-*'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-test-{0}', github.run_number) }}
        run: |
          ls -l out
          gh release create "$TAG" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Juno test build ($TAG)" --notes-file TESTERS.md
          # A tagged version is what installed apps update to (src-tauri/src/updates.rs).
          if [ -f out/latest.json ] && [[ "$TAG" == desktop-v* ]]; then
            gh release view updates > /dev/null 2>&1 || gh release create updates --prerelease --target "$GITHUB_SHA" \
              --title "Juno updates" --notes "Where installed copies of Juno look for a new version (latest.json). Keep it."
            gh release upload updates out/latest.json --clobber
          fi
