name: Test build

# Installers for testers, built on real Macs and Windows machines: a universal
# macOS .dmg (Apple Silicon and Intel) and a Windows setup .exe. A `desktop-v*` tag, or Actions → Test build → Run
# workflow, publishes them as a GitHub prerelease with TESTERS.md as its
# notes; a push that changes this file only builds them, to check it works.
#
# Built without WXT_SUPABASE_* or WXT_GATEWAY_URL: no accounts and no hosted
# answers, so testers answer with their own key, a local model or
# placeholders. No key of any kind goes into a build. No caches either: a
# build others install never restores anything an ordinary run saved. The
# release carries SHA256SUMS and a signed build provenance attestation
# (`gh attestation verify <file> --repo jeffreylan0/selectionai`).
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    branches: ['**']
    paths: ['.github/workflows/desktop-release.yml']

permissions:
  contents: read

jobs:
  app:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            bundle: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            asset: mac.dmg
            # Signed ad hoc: without a Developer ID macOS still warns once,
            # but an unsigned bundle would be called "damaged" instead.
            signing: '-'
          - name: Windows (setup .exe)
            os: windows-latest
            targets: ''
            args: --bundles nsis
            bundle: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            asset: windows-setup.exe
            signing: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing }}
        run: pnpm --filter desktop exec tauri build ${{ matrix.args }}
      - name: Name the installer
        shell: bash
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp ${{ matrix.bundle }} "out/Juno-$version-${{ matrix.asset }}"
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish the prerelease
    needs: [app]
    # A desktop-v* tag, or Run workflow on main: never a release from another branch.
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: TESTERS.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/Juno-*'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-test-{0}', github.run_number) }}
        run: |
          ls -l out
          gh release create "$TAG" out/* --prerelease --target "$GITHUB_SHA" \
            --title "Juno test build ($TAG)" --notes-file TESTERS.md
